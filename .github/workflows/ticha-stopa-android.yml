name: Build Ticha Stopa APK

on:
  push:
    branches: [ "ticha-stopa-v02" ]
    paths:
      - "ticha-stopa/**"
      - ".github/workflows/ticha-stopa-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticha-stopa
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Ticha-Stopa-v0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ticha-Stopa-v0.3
          path: ticha-stopa/Ticha-Stopa-v0.3.apk
          retention-days: 14
